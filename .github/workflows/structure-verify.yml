name: Structure Capture Verification
on:
  push:
    paths:
      - 'backend/reviews/**'
      - 'backend/requirements.txt'
      - 'frontend/src/**'
      - '.github/workflows/structure-verify.yml'
  workflow_dispatch:

jobs:
  structure-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated parser dependencies
        run: python -m pip install beautifulsoup4==4.13.4 Pillow==11.3.0 pytesseract==0.3.13
      - name: Compile Python sources
        run: python -m compileall -q backend/reviews
      - name: Structure fixture tests
        working-directory: backend
        run: python -m unittest reviews.test_structure_extractors -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install packages
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
