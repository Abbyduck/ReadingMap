name: Structure Capture Verification
on:
  push:
    paths:
      - 'backend/reviews/**'
      - 'backend/requirements.txt'
      - 'frontend/src/**'
      - '.github/workflows/structure-verify.yml'
  workflow_dispatch:

jobs:
  structure-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated parser dependencies
        run: python -m pip install beautifulsoup4==4.13.4 Pillow==11.3.0 pytesseract==0.3.13
      - name: Compile Python sources
        run: python -m compileall -q backend/reviews
      - name: Structure fixture tests
        working-directory: backend
        run: python -m unittest reviews.test_structure_extractors -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install packages
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  django-structure-stage:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: reading_map_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DJANGO_SECRET_KEY: structure-ci-only-not-production
      DATABASE_HOST: 127.0.0.1
      DATABASE_NAME: reading_map_test
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      DJANGO_DEBUG: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MySQL client headers
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Structure staging tests
        working-directory: backend
        run: python manage.py test reviews.test_structure_staging -v 2 --noinput
